<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Paceup</title>
<style>
:root{--bg:#111318;--card:#1B1E25;--seg:#2A2E37;--tx:#F2F2F0;--mu:#8A8F98;--ac:#FF6B3D;--ok:#8FD19E}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{height:100%;max-width:480px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
section{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
section[hidden]{display:none}
.scroll{overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.lb{color:var(--mu);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.center{text-align:center}
.col{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;gap:3px}.seg span{flex:1;height:4px;border-radius:2px;background:var(--seg)}.seg .d{background:var(--ac)}.seg .u{background:#FFC8B5}
.mt{display:flex;justify-content:space-between;text-align:center}.mt b{display:block;font-size:24px;font-weight:500}
.card{background:var(--card);border-radius:14px;padding:12px 14px}
button{font:inherit;border:0;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.pri{background:var(--ac);color:#1A0A04;border-radius:999px;padding:16px;font-size:17px;font-weight:500;width:100%}
.sec{background:var(--card);border-radius:999px;padding:12px 18px}
.sm{padding:6px 12px;font-size:13px;background:var(--seg)}
.big{font-size:clamp(64px,22vw,96px);font-weight:500;line-height:1}
.chip{display:inline-block;border-radius:999px;padding:4px 12px;font-size:13px;background:#22352A;color:var(--ok)}
.chip.warn{background:#3A2A22;color:#FFC8B5}
.pause{width:56px;height:56px;border-radius:50%;background:var(--ac);color:#1A0A04;font-size:20px;font-weight:500}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bars{display:flex;align-items:flex-end;gap:2px;height:46px}.bars span{border-radius:2px}
.in{background:#0E1014;border:1px solid var(--seg);border-radius:10px;color:inherit;font:inherit;padding:9px 10px;width:100%;margin-top:4px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.fg label{font-size:12px;color:var(--mu)}
.wk{font-size:12px;color:var(--mu)}.wk span{color:var(--tx);display:block;font-size:15px}.wk .t{background:var(--ac);color:#1A0A04;border-radius:10px;padding:2px 8px}.wk .t span{color:#1A0A04}
</style>
</head>
<body>
<main>

<section id="home">
  <div><div class="lb" id="dt"></div><h1 style="font-size:28px;font-weight:500;margin:4px 0 0">Paceup</h1></div>
  <div class="mt wk" id="wk"></div>
  <div class="scroll" id="sc"><div id="rs"></div><div class="lb">Meus treinos</div><div class="col" id="list"></div><div class="lb" style="margin-top:6px">Histórico</div><div class="col" id="hist"></div></div>
  <button class="pri" id="nw">Criar treino</button>
</section>

<section id="edit">
  <div class="row"><button class="sec sm" id="eb">Voltar</button><span class="lb" id="et"></span><span style="width:64px"></span></div>
  <input class="in" id="nm" maxlength="40" placeholder="Nome do treino" aria-label="Nome do treino" style="font-size:20px">
  <div class="bars" id="pv"></div>
  <div class="scroll" id="bl"></div>
  <div class="row" id="add" style="flex-wrap:wrap;justify-content:flex-start;gap:8px">
    <button class="sec sm" data-a="w">+ Aquecimento</button><button class="sec sm" data-a="i">+ Tiros</button><button class="sec sm" data-a="c">+ Corrida</button><button class="sec sm" data-a="k">+ Desaquecimento</button>
  </div>
  <div id="msg" style="color:#FFC8B5;min-height:18px"></div>
  <button class="pri" id="sv">Salvar treino</button>
  <button class="sec" id="del" hidden>Excluir treino</button>
</section>

<section id="pre">
  <div class="row"><button class="sec sm" id="pb">Voltar</button><span class="lb" id="wn"></span><span style="width:64px"></span></div>
  <div class="center"><div class="lb">Para começar</div>
    <h1 style="font-size:24px;font-weight:500;color:var(--ac);margin:6px 0 0" id="pt"></h1><div id="pd"></div>
    <div class="lb" style="margin-top:10px">Próximo</div><div id="pn"></div></div>
  <div class="seg" id="segPre"></div>
  <div class="mt"><div><b>0,00</b><span class="lb">km</span></div><div><b>0:00</b><span class="lb">tempo</span></div><div><b>--:--</b><span class="lb">ritmo médio</span></div></div>
  <div class="card" style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mu)" id="gpsBox">Procurando sinal de GPS…</div>
  <button class="pri" id="go">Iniciar</button>
</section>

<section id="run">
  <div class="seg" id="segRun"></div>
  <div class="center" style="margin-top:12px"><div class="lb" id="bn"></div>
    <div class="big" id="pace">--:--</div>
    <div style="color:var(--mu)" id="tgt">/km</div>
    <div style="margin-top:10px"><span class="chip" id="chip">Aguardando</span></div></div>
  <div class="card center"><span class="lb">Próximo</span><div style="font-size:17px" id="nx"></div></div>
  <div class="mt"><div><b id="dist">0,00</b><span class="lb">km</span></div><div><b id="time">0:00</b><span class="lb">tempo</span></div><div><b id="avg">--:--</b><span class="lb">ritmo médio</span></div></div>
  <div class="row" style="margin-top:auto">
    <div class="card" style="flex:1;color:var(--mu);min-height:56px;display:flex;align-items:center" id="voice">Voz ativada</div>
    <button class="sec" id="stop">Encerrar</button>
    <button class="pause" id="pz" aria-label="Pausar">II</button>
  </div>
</section>

<section id="end">
  <div class="center" style="margin-top:20px"><div class="lb" id="el">Treino concluído</div><h1 style="font-weight:500;font-size:28px;margin:6px 0" id="en"></h1></div>
  <div class="mt" style="margin-top:20px"><div><b id="eD">0,00</b><span class="lb">km</span></div><div><b id="eT">0:00</b><span class="lb">tempo</span></div><div><b id="eP">--:--</b><span class="lb">ritmo médio</span></div></div>
  <div class="card" id="rt" style="flex:1;min-height:220px;padding:8px"></div>
  <button class="sec" id="gx">Exportar GPX</button>
  <button class="sec" id="dh" hidden>Excluir do histórico</button>
  <button class="pri" id="eh">Voltar ao início</button>
</section>

</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const show=id=>['home','edit','pre','run','end'].forEach(s=>$(s).hidden=s!==id);
const pad=n=>String(n).padStart(2,'0');
const fmt=s=>{if(!isFinite(s)||s<=0)return '--:--';const r=Math.round(s);return Math.floor(r/60)+':'+pad(r%60)};
const km=m=>(m/1000).toFixed(2).replace('.',',');
const dm=m=>m>=1000?String(+(m/1000).toFixed(2)).replace('.',',')+' km':m+' m';
const clock=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+pad(m):m)+':'+pad(s%60)};
const pp=s=>{const m=/^(\d{1,2}):(\d{2})$/.exec(s.trim());return m?+m[1]*60+ +m[2]:null};

/* dados: treinos salvos no aparelho */
const NM={w:'Aquecimento',c:'Corrida',k:'Desaquecimento',i:'Tiros'};
let store=[];try{store=JSON.parse(localStorage.getItem('paceup.w'))||[]}catch(e){}
if(!store.length)store=[{id:1,name:'Tiros de 400 m',blocks:[{t:'w',d:1600,p:360},{t:'i',reps:6,d:400,p:270,rd:200},{t:'k',d:1000,p:375}]}];
const load=k=>{try{return JSON.parse(localStorage.getItem('paceup.'+k))}catch(e){return null}};
const put=(k,v)=>{try{localStorage.setItem('paceup.'+k,JSON.stringify(v));return true}catch(e){return false}};
let hist=load('h')||[];
const drop=()=>{try{localStorage.removeItem('paceup.s')}catch(e){}};
const persist=()=>{try{localStorage.setItem('paceup.w',JSON.stringify(store))}catch(e){}};
function flat(w){const o=[];w.blocks.forEach(b=>{if(b.t==='i')for(let i=1;i<=b.reps;i++){o.push({n:'Tiro '+i+' de '+b.reps,d:b.d,p:b.p});if(b.rd&&i<b.reps)o.push({n:'Trote',d:b.rd})}else o.push({n:NM[b.t],d:b.d,p:b.p})});return o}
const tot=w=>flat(w).reduce((a,b)=>a+b.d,0);
const mins=w=>Math.round(flat(w).reduce((a,b)=>a+b.d/1000*(b.p||360),0)/60);
const bars=w=>flat(w).map(b=>`<span style="flex:${b.d};height:${!b.p?30:b.p<=300?100:b.p<=345?70:45}%;background:${!b.p?'#8A5545':b.p<=300?'var(--ac)':'#4A4F5A'}"></span>`).join('');

/* home */
function home(){
  const d=new Date();$('dt').textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const mo=new Date(d);mo.setDate(d.getDate()-(d.getDay()+6)%7);
  $('wk').innerHTML=[...'STQQSSD'].map((l,i)=>{const x=new Date(mo);x.setDate(mo.getDate()+i);return `<div class="${x.toDateString()===d.toDateString()?'t':''}">${l}<span>${x.getDate()}</span></div>`}).join('');
  $('list').innerHTML=store.length?store.map(w=>`<div class="card wc" data-id="${w.id}" style="cursor:pointer"><div class="row"><b style="font-weight:500;font-size:17px">${esc(w.name)}</b><button class="sm" data-e="${w.id}">Editar</button></div><div style="color:var(--mu);margin:2px 0 10px">${dm(tot(w))} · ${mins(w)} min</div><div class="bars">${bars(w)}</div></div>`).join(''):'<div style="color:var(--mu)">Nenhum treino ainda. Crie o primeiro abaixo.</div>';
  $('hist').innerHTML=hist.length?hist.map(h=>`<div class="card hc" data-h="${h.id}" style="cursor:pointer"><div class="row"><b style="font-weight:500">${esc(h.name)}</b><span class="lb">${new Date(h.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</span></div><div style="color:var(--mu)">${km(h.dist)} km · ${clock(h.time)} · ${fmt(h.time/(h.dist/1000))}/km</div></div>`).join(''):'<div style="color:var(--mu)">Seus treinos concluídos aparecem aqui.</div>';
  const sv=load('s');$('rs').innerHTML=sv?`<div class="card" style="border:1px solid var(--ac);margin-bottom:10px"><div class="lb">Treino em andamento</div><div style="margin:4px 0 10px">${esc(sv.name)} · ${km(sv.td)} km</div><div class="row"><button class="pri" style="padding:10px;width:auto;flex:1" data-r="1">Retomar</button><button class="sec" data-r="0">Descartar</button></div></div>`:'';
  show('home');
}
$('sc').onclick=e=>{const b=e.target.closest('[data-e]');if(b)return edit(b.dataset.e);const r=e.target.closest('[data-r]');if(r){if(r.dataset.r==='1')return resume();drop();return home()}const h=e.target.closest('.hc');if(h)return result(hist.find(x=>x.id==h.dataset.h),true);const c=e.target.closest('.wc');if(c)pre(c.dataset.id)};
$('nw').onclick=()=>edit(null);

/* editor */
let cur=null,isNew=false;
function edit(id){
  const w=store.find(x=>x.id==id);isNew=!w;
  cur=w?JSON.parse(JSON.stringify(w)):{id:Date.now(),name:'',blocks:[{t:'w',d:1000,p:360}]};
  $('nm').value=cur.name;$('del').hidden=isNew;$('et').textContent=isNew?'Novo treino':'Editar treino';$('msg').textContent='';
  blocks();show('edit');
}
const preview=()=>{$('pv').innerHTML=bars(cur)};
function blocks(){
  $('bl').innerHTML=cur.blocks.map((b,i)=>{
    const f=(k,l,v,ph)=>`<label>${l}<input class="in" data-i="${i}" data-k="${k}" value="${v??''}" placeholder="${ph||''}" inputmode="${k==='p'?'text':'numeric'}"></label>`;
    const pv=b.p?fmt(b.p):'';
    return `<div class="card"><div class="row"><b style="font-weight:500">${NM[b.t]}</b><button class="sm" data-x="${i}">Remover</button></div><div class="fg" style="margin-top:8px">${b.t==='i'?f('reps','Repetições',b.reps)+f('d','Tiro (m)',b.d)+f('p','Ritmo /km',pv,'4:30')+f('rd','Trote (m)',b.rd):f('d','Distância (m)',b.d)+f('p','Ritmo /km',pv,'opcional')}</div></div>`}).join('');
  preview();
}
$('bl').oninput=e=>{const t=e.target,b=cur.blocks[t.dataset.i];if(!b)return;b[t.dataset.k]=t.dataset.k==='p'?pp(t.value):Math.max(0,parseInt(t.value)||0);preview()};
$('bl').onclick=e=>{const x=e.target.dataset.x;if(x!==undefined){cur.blocks.splice(+x,1);blocks()}};
$('add').onclick=e=>{const a=e.target.dataset.a;if(!a)return;cur.blocks.push({w:{t:'w',d:1000,p:360},c:{t:'c',d:2000,p:330},k:{t:'k',d:1000,p:375},i:{t:'i',reps:6,d:400,p:270,rd:200}}[a]);blocks()};
$('sv').onclick=()=>{
  if(!cur.blocks.length||cur.blocks.some(b=>!b.d||(b.t==='i'&&!b.reps))){$('msg').textContent='Cada bloco precisa de distância (e de repetições, nos tiros).';return}
  cur.name=$('nm').value.trim()||'Treino sem nome';
  const i=store.findIndex(x=>x.id==cur.id);i<0?store.push(cur):store[i]=cur;persist();home();
};
$('del').onclick=()=>{if(confirm('Excluir este treino?')){store=store.filter(x=>x.id!=cur.id);persist();home()}};
$('eb').onclick=home;

/* voz */
function say(t){$('voice').textContent='“'+t+'”';try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.speak(u)}catch(e){}}
const spoken=p=>{const m=Math.floor(p/60),s=Math.round(p%60);return s?m+' e '+s:m+' minutos'};

/* gps */
const SIM=location.search.includes('sim');
let acc=null,last=null,gpsOn=false;
const hav=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lon-a.lon),q=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(q))};
function onFix(pos){
  acc=pos.coords.accuracy;
  $('gpsBox').textContent=(acc<=10?'GPS: sinal bom':acc<=30?'GPS: sinal razoável':'GPS: sinal fraco')+' (±'+Math.round(acc)+' m)';
  if(!running||acc>30)return;
  const p={lat:pos.coords.latitude,lon:pos.coords.longitude,t:pos.timestamp};
  const add=()=>pts.push([+p.lat.toFixed(5),+p.lon.toFixed(5),Math.round(p.t/1000)]);
  if(last){const d=hav(last,p),dt=(p.t-last.t)/1000;if(d>=3&&dt>0&&d/dt<10){add();feed(d);last=p}}else{last=p;add()}
}
function startGps(){
  if(SIM){$('gpsBox').textContent='Modo simulação: sem GPS real';return}
  if(!navigator.geolocation){$('gpsBox').textContent='Este aparelho não tem GPS no navegador.';return}
  navigator.geolocation.watchPosition(onFix,e=>{$('gpsBox').textContent=e.code===1?'Permita o acesso à localização para treinar.':'Sem sinal de GPS.'},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
}

/* pré-treino */
let W=[];
function buildSeg(id){$(id).innerHTML=W.map(()=>'<span></span>').join('')}
function pre(id){
  cur=store.find(x=>x.id==id);W=flat(cur);const a=W[0],n=W[1];
  $('wn').textContent=cur.name;$('pt').textContent=a.n;$('pd').textContent=dm(a.d)+(a.p?' a '+fmt(a.p)+'/km':'');
  $('pn').textContent=n?dm(n.d)+' · '+n.n+(n.p?' a '+fmt(n.p)+'/km':''):'Última parte';
  buildSeg('segPre');$('segPre').firstChild.className='u';
  show('pre');if(!gpsOn){gpsOn=true;startGps()}
}
$('pb').onclick=home;

/* treino ativo */
let running=false,bi=0,bd=0,td=0,acum=0,t0=0,samples=[],lastCue=0,said100=false,simId=0,wl=null,pts=[],tickId=0,t00=0,ticks=0,shown=null;
const elapsed=()=>acum+(running?(Date.now()-t0)/1000:0);
function startBlock(){const b=W[bi];said100=false;lastCue=Date.now();say(b.n+(b.p?', ritmo alvo '+spoken(b.p):''))}
function curPace(){if(samples.length<2)return NaN;const a=samples[0],z=samples[samples.length-1],dd=z[1]-a[1];return dd>5?((z[0]-a[0])/1000)/(dd/1000):NaN}
function feed(d){
  if(!running)return;
  td+=d;bd+=d;const now=Date.now();samples.push([now,td]);while(samples.length&&now-samples[0][0]>12000)samples.shift();
  while(bd>=W[bi].d){bd-=W[bi].d;bi++;if(bi>=W.length){finish();return}startBlock()}
  const b=W[bi],p=curPace();
  if(!said100&&b.d-bd<=100&&b.d>=300){said100=true;say('Faltam cem metros')}
  if(b.p&&isFinite(p)&&now-lastCue>30000){if(p>b.p+15){say('Acelere um pouco');lastCue=now}else if(p<b.p-15){say('Desacelere um pouco');lastCue=now}}
  render(p);
}
function render(p){
  const b=W[bi],nx=W[bi+1],c=$('chip');
  $('bn').textContent=b.n;$('pace').textContent=fmt(p);$('tgt').textContent='/km'+(b.p?' · alvo '+fmt(b.p):'');
  if(!b.p||!isFinite(p)){c.textContent=isFinite(p)?'Ritmo livre':'Aguardando';c.className='chip'}
  else if(p>b.p+10){c.textContent='Acelere';c.className='chip warn'}
  else if(p<b.p-10){c.textContent='Desacelere';c.className='chip warn'}
  else{c.textContent='No ritmo';c.className='chip'}
  $('nx').textContent=nx?dm(nx.d)+' · '+nx.n+(nx.p?' a '+fmt(nx.p)+'/km':''):'Última parte';
  document.querySelectorAll('#segRun span').forEach((s,i)=>s.className=i<bi?'d':i===bi?'u':'');
  $('dist').textContent=km(td);$('time').textContent=clock(elapsed());$('avg').textContent=td>50?fmt(elapsed()/(td/1000)):'--:--';
}
async function begin(){
  if(!SIM&&(acc===null||acc>30)){$('gpsBox').textContent='Aguarde o sinal de GPS melhorar para começar.';return}
  buildSeg('segRun');show('run');
  bi=bd=td=acum=0;pts=[];samples=[];t00=Date.now();running=true;t0=t00;last=null;
  try{wl=await navigator.wakeLock.request('screen')}catch(e){}
  say('Vamos começar');setTimeout(startBlock,1800);
  if(SIM)simId=setInterval(()=>{if(!running)return;const k=pts.length;pts.push([+(10+k*0.000032).toFixed(5),+(10+0.0006*Math.sin(k/60)).toFixed(5),Math.round(Date.now()/1000)]);feed(3.6)},1000);
  clearInterval(tickId);tickId=setInterval(tick,1000);
  render(NaN);
}
function pause(){
  if(running){acum+=(Date.now()-t0)/1000;running=false;autosave();$('pz').textContent='▶';$('pz').setAttribute('aria-label','Retomar');say('Treino pausado')}
  else{running=true;t0=Date.now();last=null;samples=[];try{navigator.wakeLock.request('screen').then(x=>wl=x).catch(()=>{})}catch(e){}$('pz').textContent='II';$('pz').setAttribute('aria-label','Pausar');say('Retomando')}
}
function finish(){
  const t=elapsed();running=false;clearInterval(simId);clearInterval(tickId);try{wl&&wl.release()}catch(e){}
  if(td<50){drop();return home()}
  say('Treino concluído. Bom trabalho');
  const r={id:Date.now(),name:cur.name,date:new Date(t00).toISOString(),dist:td,time:t,pts};
  hist.unshift(r);if(!put('h',hist)){r.pts=[];put('h',hist)}
  drop();result(r,false);
}
function tick(){if(!running)return;render(curPace());if(++ticks%5===0)autosave()}
function autosave(){put('s',{w:cur,name:cur.name,bi,bd,td,el:elapsed(),pts,t00})}
function resume(){
  const s=load('s');if(!s)return home();
  cur=s.w;W=flat(cur);bi=s.bi;bd=s.bd;td=s.td;acum=s.el;pts=s.pts||[];t00=s.t00;samples=[];running=false;last=null;
  buildSeg('segRun');$('pz').textContent='▶';$('pz').setAttribute('aria-label','Retomar');show('run');
  if(!gpsOn){gpsOn=true;startGps()}
  clearInterval(tickId);tickId=setInterval(tick,1000);render(NaN);say('Treino restaurado. Toque em retomar para continuar');
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)autosave()});

/* resultado, mapa do trajeto e GPX */
function routeSvg(p){
  if(!p||p.length<2)return '<div class="center" style="color:var(--mu);padding:20px">Sem trajeto GPS neste treino.</div>';
  const k=Math.cos(p[0][0]*Math.PI/180),xs=p.map(q=>q[1]*k*1e5),ys=p.map(q=>-q[0]*1e5);
  const x0=Math.min(...xs),y0=Math.min(...ys),w=Math.max(Math.max(...xs)-x0,1),h=Math.max(Math.max(...ys)-y0,1),m=Math.max(w,h),pd=m*.08,V=m+pd*2,ox=(m-w)/2,oy=(m-h)/2;
  const X=i=>(xs[i]-x0+pd+ox).toFixed(1),Y=i=>(ys[i]-y0+pd+oy).toFixed(1),dot=(i,c)=>`<circle cx="${X(i)}" cy="${Y(i)}" r="${V*.02}" fill="${c}"/>`;
  return `<svg viewBox="0 0 ${V} ${V}" width="100%" height="100%" role="img" aria-label="Trajeto do treino"><polyline points="${xs.map((_,i)=>X(i)+','+Y(i)).join(' ')}" fill="none" stroke="#FF6B3D" stroke-width="${V*.012}" stroke-linecap="round" stroke-linejoin="round"/>${dot(0,'#8FD19E')}${dot(p.length-1,'#FFC8B5')}</svg>`;
}
function result(r,fromHist){
  shown=r;
  $('el').textContent=fromHist?new Date(r.date).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}):'Treino concluído';
  $('en').textContent=r.name;$('eD').textContent=km(r.dist);$('eT').textContent=clock(r.time);$('eP').textContent=r.dist>50?fmt(r.time/(r.dist/1000)):'--:--';
  $('rt').innerHTML=routeSvg(r.pts);$('dh').hidden=!fromHist;$('gx').hidden=!(r.pts&&r.pts.length>1);show('end');
}
function gpx(r){return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Paceup" xmlns="http://www.topografix.com/GPX/1/1"><metadata><time>${r.date}</time></metadata><trk><name>${esc(r.name)}</name><type>running</type><trkseg>${r.pts.map(q=>`<trkpt lat="${q[0]}" lon="${q[1]}"><time>${new Date(q[2]*1000).toISOString()}</time></trkpt>`).join('')}</trkseg></trk></gpx>`}
$('gx').onclick=async()=>{
  const r=shown,name='paceup-'+r.date.slice(0,10)+'.gpx',f=new File([gpx(r)],name,{type:'application/gpx+xml'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove();
};
$('dh').onclick=()=>{if(confirm('Excluir este treino do histórico?')){hist=hist.filter(x=>x.id!==shown.id);put('h',hist);home()}};
$('eh').onclick=home;
$('go').onclick=begin;$('pz').onclick=pause;$('stop').onclick=finish;
home();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
